name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run Go tests
        run: go test -v ./...

      - name: Install TinyGo and binaryen
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          curl -sSL https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb -o tinygo.deb
          sudo dpkg -i tinygo.deb
          rm tinygo.deb

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
