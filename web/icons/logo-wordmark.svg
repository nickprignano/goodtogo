<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359 96" width="359" height="96" role="img" aria-labelledby="wm-adaptive-title">
  <title id="wm-adaptive-title">Good to Go — Adaptive Horizontal Lockup</title>
  <style>
    .wm-ink { fill: #16171A; }
    .wm-rim { stroke: #8C6830; stroke-opacity: 0.38; }
    @media (prefers-color-scheme: dark) {
      .wm-ink { fill: #F0EEE9; }
      .wm-rim { stroke: #F0EEE9; stroke-opacity: 0.22; }
    }
  </style>
  <svg x="8" y="8" width="80" height="80" viewBox="16 16 480 480">
  <defs>
    <radialGradient id="wm-adaptive-kaya" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#E6C37E"/>
      <stop offset="65%" stop-color="#DCB56E"/>
      <stop offset="100%" stop-color="#CFA459"/>
    </radialGradient>
    <radialGradient id="wm-adaptive-black" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3A3F4B"/>
      <stop offset="42%" stop-color="#1E2127"/>
      <stop offset="100%" stop-color="#121417"/>
    </radialGradient>
    <radialGradient id="wm-adaptive-white" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#FAF8F2"/>
      <stop offset="100%" stop-color="#EAE4D7"/>
    </radialGradient>
  </defs>
    <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#wm-adaptive-kaya)"/>
    <rect x="20" y="20" width="472" height="472" rx="104" fill="none" class="wm-rim" stroke-width="10"/>
  <!-- 2x2 Goban Lacquer Grid -->
  <g stroke="#382812" stroke-width="14" stroke-linecap="round">
    <line x1="116" y1="184" x2="396" y2="184"/>
    <line x1="116" y1="328" x2="396" y2="328"/>
    <line x1="184" y1="116" x2="184" y2="396"/>
    <line x1="328" y1="116" x2="328" y2="396"/>
  </g>

  <!-- Subtle Tactile Drop Shadows -->
  <g fill="#2A1C0B" fill-opacity="0.22">
    <circle cx="187" cy="190" r="56"/>
    <circle cx="331" cy="334" r="56"/>
    <circle cx="187" cy="334" r="56"/>
  </g>

  <!-- [0,0] Nachi Slate Black Stone -->
  <circle cx="184" cy="184" r="56" fill="url(#wm-adaptive-black)" stroke="#101215" stroke-width="2"/>

  <!-- [1,1] Nachi Slate Black Stone (Diagonal Kosumi) -->
  <circle cx="328" cy="328" r="56" fill="url(#wm-adaptive-black)" stroke="#101215" stroke-width="2"/>

  <!-- [0,1] Hamaguri Clamshell White Stone -->
  <circle cx="184" cy="328" r="56" fill="url(#wm-adaptive-white)" stroke="#6E5839" stroke-width="3"/>

  <!-- [1,0] Open Intersection — Hanko Seal / Ready Liberty Point -->
  <circle cx="328" cy="184" r="31" fill="#FAF8F2"/>
  <circle cx="328" cy="184" r="22" fill="#C2361E"/>
  </svg>
